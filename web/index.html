<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cubi Cyber</title>
  <style>
    html,body {width:100%;height:100%;margin:0;background:#10151d;color:#e2e8f0;font:14px system-ui,sans-serif;overflow:hidden}
    canvas {display:block;width:100%;height:100%;outline:none}
    #status {position:fixed;left:1rem;bottom:1rem;margin:0;padding:.65rem .9rem;border-radius:.3rem;background:#10151dcc;pointer-events:none;max-width:min(42rem,85vw)}
    [data-m0="error"] #status,[data-m2="error"] #status {color:#ffccbb}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Мир Cubi Cyber"></canvas>
  <p id="status" role="status">Подготовка мира…</p>
  <script>
    // Startup errors must remain visible even if the ES module fails to load.
    function clientFailure(error) {
      const scene=new URLSearchParams(location.search).get('scene')==='sky'?'m0':'m2';
      document.documentElement.dataset[scene]='error';
      document.getElementById('status').textContent=`Не удалось запустить игру: ${error?.message||error}`;
    }
    addEventListener('error',event=>clientFailure(event.error||event.message));
    addEventListener('unhandledrejection',event=>clientFailure(event.reason));
  </script>
  <script type="module">
    const sky=new URLSearchParams(location.search).get('scene')==='sky';
    const status=document.getElementById('status');
    window.__CLIENT_READY=(async()=>{
      try {
        if(!navigator.gpu) throw new Error('Нужен Chrome или Edge с WebGPU. WebGL не поддерживается.');
        const module=await import('./pkg/client_web.js');
        await module.default();
        const result=await module.start();
        if(sky) {
          window.__M0=result;window.__M0_RESULT=result;
          document.documentElement.dataset.m0='ready';
          document.documentElement.dataset.skyReady='true';
          status.textContent='Cubi Cyber';
        } else {
          window.__M2=result;window.__M2Stats=()=>module.scene_stats();
          document.documentElement.dataset.m2='ready';
          status.textContent='Нажмите на мир, чтобы начать. WASD — движение · Пробел — прыжок · F — полёт · V — камера · ЛКМ — добывать · ПКМ — камень · Esc — мышь. Демо: деревянная кирка и камень.';
          document.addEventListener('pointerlockchange',()=>{
            status.textContent=document.pointerLockElement?'WASD · Ctrl — бег · Shift — присед/вниз · F — полёт · V — камера · ЛКМ/ПКМ — блоки':'Нажмите на мир, чтобы продолжить.';
          });
        }
        return result;
      } catch(error) {
        clientFailure(error);
        const result={ok:false,error:String(error)};
        if(sky){window.__M0=result;window.__M0_RESULT=result;}else{window.__M2=result;}
        console.error(error);return result;
      }
    })();
    window.__M0_READY=window.__CLIENT_READY;
    window.__M2_READY=window.__CLIENT_READY;
  </script>
</body>
</html>
