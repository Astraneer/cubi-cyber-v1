<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cubi Cyber — M0</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #10151d; color: #e2e8f0; font: 15px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; left: 1rem; bottom: 1rem; margin: 0; padding: .6rem .9rem; border-radius: .3rem; background: #10151dcc; }
    [data-m0="error"] #status { max-width: 36rem; color: #ffccbb; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Процедурное небо Cubi Cyber"></canvas>
  <p id="status" role="status">Подготовка WebGPU…</p>
  <script type="module">
    import init, { start } from './pkg/client_web.js';
    window.__M0_READY = (async () => {
      const status = document.getElementById('status');
      try {
        if (!navigator.gpu) {
          throw new Error('Нужен Chrome или Edge с WebGPU. WebGL не поддерживается.');
        }
        await init();
        const result = await start();
        document.documentElement.dataset.m0 = 'ready';
        document.documentElement.dataset.skyReady = 'true';
        status.textContent = 'Cubi Cyber · M0 · WebGPU · MSAA 4×';
        window.__M0_RESULT = result;
        window.__M0 = result;
        return result;
      } catch (error) {
        document.documentElement.dataset.m0 = 'error';
        status.textContent = `Не удалось запустить WebGPU: ${error.message || error}`;
        const result = { ok: false, error: String(error) };
        window.__M0_RESULT = result;
        window.__M0 = result;
        console.error(error);
        return result;
      }
    })();
  </script>
</body>
</html>
