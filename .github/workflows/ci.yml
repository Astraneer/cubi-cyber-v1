name: Acceptance

on:
  push:
    branches-ignore:
      - codex-ci-results
  pull_request:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, software Vulkan and browser WebGPU
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install software graphics and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev xvfb xauth
      - name: Bootstrap locked toolchain and dependencies
        run: bash tools/bootstrap.sh
      - name: Verify imported donor without private network access
        run: bash tools/import_donor.sh --verify
      - name: Required checks, native window, WASM and actual WebGPU pixels
        env:
          # Google Chrome ships SwiftShader on GitHub-hosted Ubuntu runners.
          CHROMIUM: google-chrome
        run: bash tools/check.sh
      - name: Verify visible WebGPU canvas in virtual X11
        if: always() && hashFiles('.local/web-dist/index.html') != ''
        env:
          CHROMIUM: google-chrome
        run: |
          xvfb-run -a node tools/web_smoke.mjs --headed
          xvfb-run -a node tools/terrain_smoke.mjs --headed
      - name: Build portable Linux and web bundles
        run: bash tools/build_release.sh linux --web
      - name: Preserve portable Linux and web bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cubi-linux-and-web
          path: .local/artifacts/dist/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve actual browser and GPU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-rendering-evidence
          path: |
            .local/artifacts/**/*.png
            .local/artifacts/*smoke.json
            .local/artifacts/bench/*.json
            .local/artifacts/bench/*.html
            .local/artifacts/product-flight-recorder.json
            .local/artifacts/*movement-replay.txt
            .local/artifacts/flight/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  windows:
    name: Windows native compilation
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap locked toolchain
        run: bash tools/bootstrap.sh
      - name: Compile Windows shell and all native targets
        run: |
          source tools/env.sh
          bash tools/check_one.sh 'Windows native targets' cargo check --locked --workspace --all-targets
          bash tools/check_one.sh 'Windows core and telemetry' cargo test --locked -p core-types -p telemetry
      - name: Render shared sky with D3D12 WARP
        run: |
          source tools/env.sh
          bash tools/check_one.sh 'Windows WARP sky' cargo test --locked -p render --test software_sky -- --nocapture
      - name: Compare shadow functions on identical material geometry with D3D12 WARP
        run: |
          source tools/env.sh
          bash tools/check_one.sh 'Windows WARP shadow function differential' cargo test --locked -p render --test material_shadow -- --test-threads=1 --nocapture
      - name: Validate local material pipelines with D3D12 WARP
        run: |
          source tools/env.sh
          bash tools/check_one.sh 'Windows WARP material pack' cargo test --locked -p render --test material_pack -- --test-threads=1 --nocapture
      - name: Validate authoritative light and shadow buffers with D3D12 WARP
        run: |
          source tools/env.sh
          bash tools/check_one.sh 'Windows WARP authoritative light' cargo test --locked -p client --test lighting_gpu -- --test-threads=1 --nocapture
      - name: Validate sparse shadow preservation with D3D12 WARP
        run: |
          source tools/env.sh
          bash tools/check_one.sh 'Windows WARP shadow footprints' cargo test --locked -p render --test shadow_footprint -- --nocapture
          bash tools/check_one.sh 'Windows WARP sparse shadow depth' cargo test --locked -p render --test shadows shadow_sparse::gpu_projected_old_new_clear_matches_full_depth_for_sun_models_and_removal -- --exact --nocapture
      - name: Present three native Windows frames
        run: bash tools/windows_native_smoke.sh
      - name: Build portable Windows bundle
        run: bash tools/build_release.sh windows
      - name: Preserve portable Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cubi-windows
          path: .local/artifacts/dist/*
          include-hidden-files: true
          if-no-files-found: error

  report:
    name: Relay actual CI evidence and stage delivery
    needs: [linux, windows]
    if: >-
      always() && github.event_name == 'push' &&
      github.repository == 'Astraneer/cubi-cyber-v1' &&
      (startsWith(github.ref_name, 'm0-') || startsWith(github.ref_name, 'm1-') ||
       startsWith(github.ref_name, 'm2-') || startsWith(github.ref_name, 'm3-') ||
       startsWith(github.ref_name, 'm4-') || startsWith(github.ref_name, 'm5-') ||
       startsWith(github.ref_name, 'm6-') || startsWith(github.ref_name, 'm7-') ||
       startsWith(github.ref_name, 'm8-') || startsWith(github.ref_name, 'm9-') ||
       startsWith(github.ref_name, 'm10-') || startsWith(github.ref_name, 'm11-') ||
       startsWith(github.ref_name, 'm12-') || startsWith(github.ref_name, 'm13-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Publish exact source/run/check results through Git
        env:
          CI_REPORT_LINUX_RESULT: ${{ needs.linux.result }}
          CI_REPORT_WINDOWS_RESULT: ${{ needs.windows.result }}
          CI_REPORT_CREATE_PR: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_report.py
      - name: Preserve relay evidence if Git delivery fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-ci-report
          path: .local/ci-report/reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
