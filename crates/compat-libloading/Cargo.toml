[package]
name = "libloading"
version = "0.8.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Cubi's limited compatibility API backed by the MIT dlopen2 loader"

[dependencies]
dlopen2 = { version = "=0.9.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
